name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./app/package.json').version")
          xml=$(grep -o '<widget[^>]*' app/public/config.xml | grep -o ' version="[^"]*"' | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg config.xml=$xml"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$xml" ]; then exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Zip the app
        run: cd app/dist && zip -r "../../ZnZAnime-${GITHUB_REF_NAME}.zip" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ZnZAnime-${GITHUB_REF_NAME}.zip" --title "ZnZ Anime ${GITHUB_REF_NAME}" --generate-notes
